<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Ахтунг Client (P2P Node)</title>
  <style>
    body { background: #0b0f19; color: #66b3ff; font-family: monospace; padding: 20px; }
    .box { background: #111a2e; border: 1px solid #66b3ff; padding: 15px; margin-bottom: 15px; border-radius: 8px; }
    textarea { width: 100%; height: 80px; background: #000; color: #00ff88; border: 1px solid #66b3ff; }
    button { background: #66b3ff; color: #000; font-weight: bold; padding: 8px 15px; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <h2>🎧 Клиент Ахтунга</h2>

  <div class="box">
    <h3>1. Вставь код от Егора</h3>
    <textarea id="egorOffer" placeholder="Вставь сюда код подключения от Егора..."></textarea><br><br>
    <button onclick="connectToEgor()">Принять подключение</button>
  </div>

  <div class="box">
    <h3>2. Твой ответный код (Отправь Егору)</h3>
    <textarea id="myAnswer" readonly></textarea>
  </div>

  <div class="box">
    <h3>Статус P2P Аудио</h3>
    <audio id="remoteAudio" autoplay controls></audio>
  </div>

  <script>
    let pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });

    pc.ontrack = (event) => {
      const remoteAudio = document.getElementById('remoteAudio');
      remoteAudio.srcObject = event.streams[0];
      remoteAudio.play().catch(() => {
        alert("Кликни на страницу, чтобы включить звук от Егора!");
      });
    };

    async function connectToEgor() {
      const offerStr = document.getElementById('egorOffer').value;
      if (!offerStr) return alert('Вставь код!');
      const offer = JSON.parse(offerStr);

      await pc.setRemoteDescription(offer);
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);

      pc.onicecandidate = (e) => {
        if (!e.candidate) {
          document.getElementById('myAnswer').value = JSON.stringify(pc.localDescription);
        }
      };
    }
  </script>
</body>
</html>
